name: Daily Content Post

on:
  schedule:
    # Run at 9:00 AM Central Time (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  post-content:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Daily Content Generation
        run: |
          echo "🚀 Triggering daily content generation..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
            "https://resourceful-love-production.up.railway.app/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Content generated and posted successfully!"
          else
            echo "❌ Failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Log Result
        run: |
          echo "📅 Daily post completed at $(date)"
